name: Market Volatility Watchdog

on:
  # 1. Autonomous cron trigger: runs every 30 minutes (minute 0 and minute 30)
  schedule:
    - cron: '0,30 * * * *'

  # 2. Manual trigger: allows on-demand execution for testing and judging demo
  workflow_dispatch:

jobs:
  watchdog-pipeline:
    name: Run Anomaly Detection Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Production Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Watchdog Pipeline
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -m src.main